<header class="site-header">
  <div class="container site-header__inner">
    <a class="brand" href="{{ site.Home.RelPermalink }}" aria-label="{{ T "home_link_label" }}">
      <span class="brand__short">{{ T "site_short" }}</span>
      <span class="brand__name">{{ T "site_name" }}</span>
      <span class="brand__suffix">{{ T "site_suffix" }}</span>
    </a>
    <nav class="site-nav" aria-label="{{ T "nav_main_label" }}">
      <ul>
        {{- $current := . }}
        {{- range site.Menus.main }}
        <li><a href="{{ .URL }}"{{ if $current.IsMenuCurrent "main" . }} aria-current="page"{{ end }}>{{ T .Identifier }}</a></li>
        {{- end }}
        <li>{{ partial "mailto.html" (dict "text" (T "nav_contact")) }}</li>
      </ul>
    </nav>
    {{- partial "language-switch.html" . }}
  </div>
</header>
