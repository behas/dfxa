# Push to main: build, check and deploy to GitHub Pages.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  HUGO_VERSION: 0.166.0   # keep in sync with .hugo-version and hugo.toml

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  build:
    needs: checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Hugo (extended)
        run: |
          wget -nv -O "${RUNNER_TEMP}/hugo.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "${RUNNER_TEMP}/hugo.deb"

      - id: pages
        uses: actions/configure-pages@v5

      - name: Build
        env:
          HUGO_ENVIRONMENT: production
        # baseURL stays https://dfxa.at/ (hugo.toml) so canonical URLs never
        # point to the github.io address.
        run: hugo --gc

      # Never publish draft markers: every TODO must be resolved first
      # (docs/open-items.md, scripts/list-todos.sh).
      - name: No TODO markers in published pages
        run: |
          if grep -rl "TODO" public --include="*.html" --include="*.md" --include="*.txt" --include="*.json"; then
            echo "::error::Published files contain TODO markers (listed above)."
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
